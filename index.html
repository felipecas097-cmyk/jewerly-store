<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <header class="header">
        <div class="container">

            <div class="header-top">
                <div class="header-top-left">
                <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="header-top-logo"><h1 class="header_tittle">jewerly store</h1></div>
                <div class="header-top-right">    
                     <i class="fa-solid fa-user desktop"></i>                       
                     <i class="fa-solid fa-heart desktop"></i>
                     <i class="fa-solid fa-cart-shopping desktop"></i>
                     <i class="fa-solid fa-bars mobile"></i>
                </div>
            </div>
             <nav class="menu-nav nav-navbar">

                <ul class="menu-main">
                    <a href="#" class="menu__link">Rings</a>
                    <a href="#" class="menu__link">Earrings</a>
                    <a href="#" class="menu__link">Bracelets</a>
                    <a href="#" class="menu__link">Necklaces</a>                    
                </ul>               
            </nav>
            
        </div>        
    </header>
    <main class="main">
        <section class="necklaces">         
          <h2 class="main_tittle">Necklaces</h2>
        </section>
        <section class="bracelets">         
          <h2 class="main_tittle">Bracelets</h2>
        </section>
         <section class="partners">         
          <h3 class="main_tittle-2">OUR PARTNERS</h3>

           <div class="partners-2 container-image">
                <img class="img img-bra" src="./images/bra.png" alt="background bra">
                <img class="img img-love" src="./images/love.png" alt="background love">
                <img class="img img-fashion" src="./images/fashion.png" alt="background fashion">
                <img class="img img-amebra" src="./images/amebra.png" alt="background amebra">
                <img class="img img-taq" src="./images/taq.png" alt="background taq">
                <img class="img img-dummy" src="./images/dummy.png" alt="background dummy">
            </div>

        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <h2 class="footer_title">Footer</h2>
        </div>
    </footer>
</body>
</html>
